<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Adhyora</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Yatra+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- CORE THEME STYLES --- */
        :root {
            --primary-green: #2ecc71; 
            --primary-transparent: rgba(46, 204, 113, 0.3); /* NEW: Dynamic transparent color for borders/shadows */
            --dark-bg: #0a0a0a;
            --text-light: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #tsparticles {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            top: 0; left: 0;
        }

        .scanlines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 20;
            opacity: 0.4; 
        }

        .reset-container {
            position: relative;
            z-index: 100;
            width: 90%;
            max-width: 450px;
            background: rgba(30, 30, 30, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px 30px;
            border-radius: 20px;
            border: 1px solid var(--primary-transparent); /* NOW USES DYNAMIC VARIABLE */
            box-shadow: 0 0 40px rgba(0,0,0, 0.5);
            text-align: center;
            border-top: 4px solid var(--primary-green);
            transition: border-color 0.5s ease;
        }

        /* --- HEADER STYLES --- */
        .glitch-wrapper {
            position: relative;
            font-family: 'Yatra One', system-ui; 
            font-size: clamp(1.5rem, 7vw, 2.5rem); 
            white-space: nowrap; 
            color: var(--primary-green);
            margin-bottom: 25px;
            display: inline-block;
            text-transform: uppercase;
            max-width: 100%;
            transition: color 0.5s ease;
            visibility: hidden; /* Hidden until verification completes */
        }
        
        .glitch-wrapper::before {
            content: '';
            position: absolute;
            top: 0.12em;
            left: -2%;
            width: 104%;
            height: 0.08em;
            background: var(--primary-green);
            box-shadow: 0 0 10px var(--primary-green);
            z-index: 3;
            transition: background 0.5s ease, box-shadow 0.5s ease;
        }
        
        .main-text { position: relative; z-index: 2; }
        
        .glitch-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; mix-blend-mode: screen; }
        .layer-red { color: #ff0055; z-index: 1; }
        .layer-blue { color: #00ccff; z-index: 1; }

        /* --- STANDARD FORM ELEMENTS --- */
        p {
            color: #ddd;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.5;
            font-weight: 400; 
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px; 
            color: white;
            outline: none;
            font-size: 1rem;
            transition: 0.3s;
            text-align: center;
            font-family: inherit; 
        }

        input:focus {
            border-color: var(--primary-green);
            background: rgba(255, 255, 255, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            background: var(--primary-green);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            color: #000;
            transition: 0.2s;
            text-transform: uppercase;
            font-family: inherit;
            letter-spacing: 0.5px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--primary-transparent); /* NOW USES DYNAMIC VARIABLE */
        }

        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: #888;
        }

        /* --- PASSWORD REQUIREMENTS STYLES --- */
        .password-req-list {
            list-style: none;
            padding: 10px 15px;
            margin: 0;
            text-align: left;
            font-size: 0.85rem;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .password-req-list li {
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .password-req-list li:last-child {
            margin-bottom: 0;
        }
        .req-unmet { color: #ff6b6b; }
        .req-met { color: var(--primary-green); }

        /* Status Messages & Areas */
        #statusMessage {
            margin-top: 15px;
            font-size: 0.9rem;
            min-height: 20px;
            font-weight: 500;
        }
        .error { color: #ff6b6b; }
        .success { color: var(--primary-green); }

        #loading-area {
            display: block; /* Shown by default */
        }
        #content-area {
            display: none; /* Hidden until verified */
        }

    </style>
</head>
<body>

    <div id="tsparticles"></div>
    <div class="scanlines"></div>

    <div class="reset-container">
        <div class="glitch-wrapper" id="header-glitch">
            <div class="main-text" id="glitch-text-main">RESET PASSWORD</div>
            <div class="glitch-layer layer-red" id="glitch-text-red">RESET PASSWORD</div>
            <div class="glitch-layer layer-blue" id="glitch-text-blue">RESET PASSWORD</div>
        </div>

        <!-- Verification Spinner -->
        <div id="loading-area">
            <i class="fas fa-spinner fa-spin" style="font-size: 2.5rem; color: var(--primary-green); margin-bottom: 20px;"></i>
            <p>Verifying secure link...</p>
        </div>

        <!-- The Form -->
        <div id="content-area">
            <p>Please enter your new password below.</p>

            <form id="resetForm" onsubmit="return false;">
                <input type="password" id="newPassword" placeholder="New Password" required>
                
                <button type="button" onclick="handleReset()" id="submitBtn" disabled>Update Password</button>

                <ul class="password-req-list" id="passwordRequirements">
                    <li id="req-length" class="req-unmet"><i class="fas fa-times"></i> At least 6 characters</li>
                    <li id="req-upper" class="req-unmet"><i class="fas fa-times"></i> 1 Capital letter</li>
                    <li id="req-lower" class="req-unmet"><i class="fas fa-times"></i> 1 Small letter</li>
                    <li id="req-number" class="req-unmet"><i class="fas fa-times"></i> 1 Number</li>
                    <li id="req-special" class="req-unmet"><i class="fas fa-times"></i> 1 Special character</li>
                </ul>
            </form>
        </div>

        <div id="statusMessage"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD_ixI42lNdSqWxHj2EZNpXDLBZ2U8coLA",
            authDomain: "adhyora-5d4c1.firebaseapp.com",
            projectId: "adhyora-5d4c1",
            storageBucket: "adhyora-5d4c1.firebasestorage.app",
            messagingSenderId: "206050348148",
            appId: "1:206050348148:web:da4e421e00ec2f77429521",
            measurementId: "G-N0PQPQKQRN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        // 1. CHECK THE LINK BEFORE SHOWING THE FORM
        if (!actionCode) {
            window.triggerInvalidUI();
        } else {
            verifyPasswordResetCode(auth, actionCode)
                .then((email) => {
                    window.triggerValidUI();
                })
                .catch((error) => {
                    window.triggerInvalidUI();
                });
        }

        // 2. HANDLE FORM SUBMISSION
        window.handleReset = function() {
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.innerText = "Updating...";

            confirmPasswordReset(auth, actionCode, newPass)
                .then(() => {
                    document.getElementById('content-area').innerHTML = `
                        <i class="fas fa-check-circle" style="color: var(--primary-green); font-size: 3rem; margin-bottom: 20px;"></i>
                        <p style="color: white; font-size: 1.1rem; font-weight: 500;">Password Updated!</p>
                        <p style="font-size: 0.9rem;">You can now login to the app.</p>
                    `;
                    document.getElementById('header-glitch').style.display = 'none';
                    status.innerText = "";
                })
                .catch((error) => {
                    btn.disabled = false;
                    btn.innerText = "Update Password";
                    status.className = "error";
                    status.innerText = error.message;
                });
        }
    </script>

    <!-- UI, GLITCH, PARTICLES, & VALIDATION SCRIPT -->
    <script>
        // --- UI TRIGGER FUNCTIONS ---
        
        window.triggerInvalidUI = function() {
            const THEME_COLOR = "#ff0055"; // RED
            const THEME_TRANSPARENT = "rgba(255, 0, 85, 0.3)"; // RED (Transparent)
            const TARGET_TEXT = "INVALID LINK";

            document.documentElement.style.setProperty('--primary-green', THEME_COLOR);
            document.documentElement.style.setProperty('--primary-transparent', THEME_TRANSPARENT);
            
            document.getElementById('loading-area').style.display = 'none';
            document.getElementById('content-area').style.display = 'block';
            
            // Replace form with error message
            document.getElementById('content-area').innerHTML = `
                <i class="fas fa-exclamation-triangle" style="color: ${THEME_COLOR}; font-size: 3rem; margin-bottom: 20px;"></i>
                <p style="color: white; font-size: 1.1rem; font-weight: 500;">This link is invalid or has expired.</p>
                <p style="font-size: 0.9rem;">Please request a new password reset link from the Adhyora app.</p>
            `;

            initVisuals(TARGET_TEXT, THEME_COLOR);
        };

        window.triggerValidUI = function() {
            const THEME_COLOR = "#2ecc71"; // GREEN
            const THEME_TRANSPARENT = "rgba(46, 204, 113, 0.3)"; // GREEN (Transparent)
            const TARGET_TEXT = "RESET PASSWORD";

            document.documentElement.style.setProperty('--primary-green', THEME_COLOR);
            document.documentElement.style.setProperty('--primary-transparent', THEME_TRANSPARENT);

            document.getElementById('loading-area').style.display = 'none';
            document.getElementById('content-area').style.display = 'block';

            initPasswordValidation();
            initVisuals(TARGET_TEXT, THEME_COLOR);
        };

        // --- PASSWORD VALIDATION LOGIC ---
        function initPasswordValidation() {
            const pwdInput = document.getElementById('newPassword');
            const submitBtn = document.getElementById('submitBtn');

            pwdInput.addEventListener('input', function() {
                const val = this.value;
                
                const reqs = {
                    length: val.length >= 6,
                    upper: /[A-Z]/.test(val),
                    lower: /[a-z]/.test(val),
                    number: /[0-9]/.test(val),
                    special: /[!@#$%^&*(),.?":{}|<>\-_]/.test(val) 
                };

                let allMet = true;

                for (const [key, isMet] of Object.entries(reqs)) {
                    const el = document.getElementById(`req-${key}`);
                    const icon = el.querySelector('i');
                    
                    if (isMet) {
                        el.className = 'req-met';
                        icon.className = 'fas fa-check';
                    } else {
                        el.className = 'req-unmet';
                        icon.className = 'fas fa-times';
                        allMet = false;
                    }
                }

                submitBtn.disabled = !allMet;
            });
        }

        // --- VISUALS (PARTICLES & GLITCH) ---
        function initVisuals(targetText, themeColor) {
            document.getElementById('header-glitch').style.visibility = 'visible';

            tsParticles.load("tsparticles", {
                particles: {
                    number: { value: 60, density: { enable: true, area: 800 } },
                    color: { value: themeColor }, 
                    links: { enable: true, distance: 150, color: themeColor, opacity: 0.3, width: 1 }, 
                    move: { enable: true, speed: 1, outModes: { default: "out" } },
                    opacity: { value: 0.4 },
                    size: { value: { min: 1, max: 3 } }
                },
                background: { color: "#0a0a0a" }
            });

            const CHAOS_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"; 
            class GlitchEffect {
                constructor() {
                    this.elMain = document.getElementById('glitch-text-main');
                    this.elRed = document.getElementById('glitch-text-red');
                    this.elBlue = document.getElementById('glitch-text-blue');
                    this.frame = 0;
                    this.lockIndex = 0;
                    this.animate();
                }

                animate() {
                    const animFrame = () => {
                        if (this.lockIndex > targetText.length) {
                            this.elRed.style.opacity = "0";
                            this.elBlue.style.opacity = "0";
                            this.elRed.style.transform = "none";
                            this.elBlue.style.transform = "none";
                            return; 
                        }

                        let output = "";
                        for (let i = 0; i < targetText.length; i++) {
                            if (i < this.lockIndex) {
                                output += targetText[i];
                            } else {
                                output += CHAOS_CHARS[Math.floor(Math.random() * CHAOS_CHARS.length)];
                            }
                        }

                        this.elMain.innerText = output;
                        this.elRed.innerText = output;
                        this.elBlue.innerText = output;

                        if (Math.random() > 0.8) {
                            this.elRed.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
                            this.elBlue.style.transform = `translate(${Math.random()*4-2}px, ${Math.random()*4-2}px)`;
                            this.elRed.style.opacity = 0.8;
                            this.elBlue.style.opacity = 0.8;
                        } else {
                            this.elRed.style.opacity = 0;
                            this.elBlue.style.opacity = 0;
                        }

                        if (this.frame % 4 === 0) this.lockIndex++;
                        
                        this.frame++;
                        requestAnimationFrame(animFrame);
                    };
                    requestAnimationFrame(animFrame);
                }
            }
            new GlitchEffect();
        }
    </script>
</body>
</html>
