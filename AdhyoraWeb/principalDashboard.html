<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhyora - Principal Dashboard</title>
    <link rel="stylesheet" href="principal.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- TOP NAVIGATION ICONS (PC) / BOTTOM NAV (MOBILE) -->
    <div class="icon-nav-container">
        <div class="icon-nav">
            <button class="nav-icon-btn active-nav" id="btnHome" title="Overview"><i class="fas fa-th-large"></i></button>
            <button class="nav-icon-btn" id="btnSettings" title="Settings"><i class="fas fa-cog"></i></button>
            <button class="nav-icon-btn" id="btnNotifications" title="Notifications">
                <i class="fas fa-bell"></i><span class="notification-dot"></span>
            </button>
            <button class="nav-icon-btn" id="btnCalendar" title="Calendar"><i class="fas fa-calendar-alt"></i></button>
            <button class="nav-icon-btn" id="btnMessages" title="Messages">
                <i class="fas fa-comment-dots"></i><span class="notification-dot"></span>
            </button>
        </div>
    </div>

    <div class="dashboard-wrapper">
        <!-- SIDEBAR (PC) / GRID (MOBILE) -->
        <aside class="sidebar" id="mainSidebar">
            <div class="logo-container">
                <h1 class="logo-text">ADHYORA</h1>
            </div>
            
            <div class="nav-grid">
                <button class="menu-btn"><span class="btn-text">Roomcode</span> <i class="fas fa-qrcode btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Teacher List</span> <i class="fas fa-chalkboard-teacher btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Students List</span> <i class="fas fa-clipboard-list btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Batch</span> <i class="fas fa-id-badge btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">TimeTable</span> <i class="fas fa-calendar-week btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Data Section</span> <i class="fas fa-chart-bar btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Subject List</span> <i class="fas fa-book-open btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Students Subjects</span> <i class="fas fa-book-reader btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Events</span> <i class="fas fa-calendar-plus btn-icon"></i></button>
                <button class="menu-btn"><span class="btn-text">Attendance Records</span> <i class="fas fa-user-check btn-icon"></i></button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="main-content">
            <div class="welcome-card" id="mainViewContainer">
                
                <!-- VIEW 1: Welcome (Default) -->
                <div id="welcomeView" class="dashboard-view active" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
                    <h2 class="welcome-text">Welcome To ADHYORA</h2>
                </div>

                <!-- VIEW 2: Notifications -->
                <div id="notificationsView" class="dashboard-view hidden-view" style="width: 100%; height: 100%; padding: 25px; display: flex; flex-direction: column;">
                    <h3 style="margin-bottom: 20px; flex-shrink: 0; color: var(--text-green); font-size: 24px; text-align: center; font-family: 'Yatra One', cursive; letter-spacing: 1px;">System Inbox</h3>
                    <div id="notificationsList" class="scrollable-list" style="flex: 1; overflow-y: auto; padding-right: 10px;">
                        <div class="no-data-text">Loading Notifications...</div>
                    </div>
                </div>

                <!-- VIEW 3: Calendar -->
                <div id="calendarView" class="dashboard-view hidden-view" style="width: 100%; height: 100%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    
                    <!-- 🚨 TWEAKED: Reduced max-width to 460px and padding to 20px -->
                    <div class="calendar-container" style="width: 100%; max-width: 460px; background: white; padding: 20px 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid var(--border-color); margin: auto;">
                        
                        <div class="calendar-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                            <button class="nav-icon-btn" id="calPrevMonth" style="background: var(--bg-grid-color); padding: 8px 15px; border-radius: 12px; font-weight: bold;">&lt;</button>
                            <h3 id="calMonthYearText" style="color: var(--text-green); font-size: 18px; font-weight: 700;">Loading...</h3>
                            <button class="nav-icon-btn" id="calNextMonth" style="background: var(--bg-grid-color); padding: 8px 15px; border-radius: 12px; font-weight: bold;">&gt;</button>
                        </div>
                        
                        <div class="calendar-weekdays" style="display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: 700; color: #94a3b8; font-size: 12px; margin-bottom: 10px;">
                            <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                        </div>
                        
                        <!-- 🚨 TWEAKED: Reduced gap to 6px -->
                        <div class="calendar-grid" id="calendarGrid" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;"></div>
                        
                        <!-- 🚨 TWEAKED: Tighter margins for the upcoming event banner -->
                        <div style="margin-top: 15px; padding: 12px; border-radius: 12px; background: var(--bg-grid-color); text-align: center; border: 1px solid var(--border-color);">
                            <p id="upcomingEventText" style="font-size: 13px; font-weight: 600; color: var(--text-green);">Loading...</p>
                        </div>

                    </div>
                </div>

                <!-- VIEW 4: Messages Inbox -->
                <div id="messagesView" class="dashboard-view hidden-view" style="width: 100%; height: 100%; padding: 25px; display: flex; flex-direction: column;">
                    <div style="display: flex; flex-shrink: 0; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                        <h3 style="color: var(--text-green); font-size: 24px; font-family: 'Yatra One', cursive; letter-spacing: 1px;">Messages</h3>
                        <button id="btnOpenCompose" class="nav-icon-btn" style="background: var(--brand-green); color: white; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(74, 222, 128, 0.4);"><i class="fas fa-paper-plane" style="margin-right: 8px;"></i> Compose</button>
                    </div>
                    <div id="messagesList" class="scrollable-list" style="flex: 1; overflow-y: auto; padding-right: 10px;">
                        <div class="no-data-text">Loading Messages...</div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- SETTINGS & PROFILE OVERLAY -->
    <div class="modal-overlay" id="settingsOverlay">
        <div class="settings-drawer">
            <div class="settings-header">
                <div class="profile-avatar"><i class="fas fa-user-tie"></i></div>
                <h3 id="principalNameText">Loading Principal...</h3>
                <p id="principalEmailText">email@loading.com</p>
                <div class="role-badge">Principal Administrator</div>
            </div>
            
            <div class="settings-menu">
                <button class="settings-btn" id="btnContactUs"><i class="fas fa-envelope"></i> Contact Support</button>
                <button class="settings-btn" id="btnWebsite"><i class="fas fa-globe"></i> Pixelaks Technologies</button>
                <button class="settings-btn" id="btnPrivacy"><i class="fas fa-shield-alt"></i> Privacy Policy</button>
                <button class="settings-btn" id="btnTerms"><i class="fas fa-file-contract"></i> Terms & Conditions</button>
                
                <button class="settings-btn" id="btnThemes"><i class="fas fa-palette"></i> Themes</button>
                <button class="settings-btn" id="btnDevices"><i class="fas fa-laptop-house"></i> Devices</button>
                <button class="settings-btn" id="btnToggleNotifications" style="display: flex; justify-content: space-between; align-items: center; padding-right: 15px;">
                    <div style="display: flex; align-items: center; gap: 10px;"><i class="fas fa-bell"></i> Notifications</div>
                    <div class="toggle-switch" id="notifToggleSwitch"></div>
                </button>

                <button class="settings-btn logout-btn" id="btnSignOut"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
            </div>
            
            <div class="settings-footer" id="versionText">Version 1.0.0 (Web)</div>
            <button class="close-settings" id="closeSettingsBtn"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <!-- COMPOSE MESSAGE OVERLAY -->
    <div class="modal-overlay" id="composeOverlay">
        <div class="compose-modal" style="background: white; width: 90%; max-width: 500px; margin: auto; margin-top: 5vh; border-radius: 20px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.1); position: relative; border: 1px solid var(--border-color);">
            <button class="close-settings" id="closeComposeBtn"><i class="fas fa-times"></i></button>
            <h3 style="color: var(--text-green); margin-bottom: 20px; font-size: 20px;"><i class="fas fa-bullhorn"></i> Send Announcement</h3>

            <div style="display: flex; gap: 20px; margin-bottom: 15px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #475569; cursor: pointer;">
                    <input type="checkbox" id="toggleTeachers" style="accent-color: var(--brand-green); width: 18px; height: 18px;"> Send to Teachers
                </label>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #475569; cursor: pointer;">
                    <input type="checkbox" id="toggleStudents" style="accent-color: var(--brand-green); width: 18px; height: 18px;"> Send to Students
                </label>
            </div>

            <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                <select id="composeDept" class="input-field" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-family: 'Poppins';">
                    <option value="All">All Departments</option>
                </select>
                <select id="composeYear" class="input-field" style="flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-family: 'Poppins'; display: none;">
                    <option value="All">All Years</option>
                </select>
            </div>

            <input type="text" id="composeTitle" placeholder="Message Title" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-family: 'Poppins'; font-weight: bold; margin-bottom: 15px;">
            <textarea id="composeBody" placeholder="Type your message here..." rows="5" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-family: 'Poppins'; resize: none; margin-bottom: 20px;"></textarea>

            <button id="btnSendMessage" style="width: 100%; background: var(--text-light-green); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(74, 222, 128, 0.3);">Send Broadcast</button>
            <p id="composeStatusText" style="text-align: center; color: #ef4444; font-size: 12px; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <script type="module" src="principalApp.js"></script>
</body>
</html>
