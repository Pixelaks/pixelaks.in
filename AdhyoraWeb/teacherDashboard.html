<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adhyora - Teacher Dashboard</title>
    
    <link rel="stylesheet" href="teacher.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Yatra+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="light-mode">

    <div id="initialAppLoader" style="position:fixed; inset:0; background:#0f172a; display:flex; align-items:center; justify-content:center; z-index:20000;">
        <div style="text-align:center;">
            <div style="width:50px; height:50px; border:3px solid rgba(239, 68, 68, 0.1); border-top-color:#ef4444; border-radius:50%; animation: spin 1s linear infinite; margin:0 auto 15px;"></div>
            <p style="color:#94a3b8; font-family:'Poppins'; font-size:12px; letter-spacing:1px;">LOADING ADHYORA...</p>
        </div>
    </div>

    <div class="icon-nav-container">
        <div class="icon-nav">
            <button class="nav-icon-btn" id="btnSettings"><i class="fas fa-cog"></i></button>
            <button class="nav-icon-btn" id="btnNotifications"><i class="fas fa-bell"></i><span class="notification-dot"></span></button>
            <button class="nav-icon-btn" id="btnOpenCompose"><i class="fas fa-plus"></i></button>
            <button class="nav-icon-btn" id="btnMessages"><i class="fas fa-comment-dots"></i><span class="notification-dot"></span></button>
        </div>
    </div>

    <div class="dashboard-wrapper">
        <aside class="sidebar" id="mainSidebar">
            <div class="logo-container">
                <h1 class="logo-text" id="btnHome">ADHYORA</h1>
            </div>
            
            <div class="nav-grid">
                <button class="menu-btn" id="btnNavAttendance">
                    <span class="btn-text">Attendance</span> <i class="fas fa-clipboard-check btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavTimetable">
                    <span class="btn-text">TimeTable</span> <i class="fas fa-calendar-alt btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavInternalMarks">
                    <span class="btn-text">InternalMarks</span> <i class="fas fa-award btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavSubjects">
                    <span class="btn-text">Subjects</span> <i class="fas fa-book-open btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavCalendar">
                    <span class="btn-text">Calendar</span> <i class="fas fa-calendar-day btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavAssignments">
                    <span class="btn-text">Assignments</span> <i class="fas fa-clipboard-list btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavStudentList">
                    <span class="btn-text">Student List</span> <i class="fas fa-user-friends btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavSubjectAssign">
                    <span class="btn-text">Subject Assign</span> <i class="fas fa-book-medical btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavBatch">
                    <span class="btn-text">Batch</span> <i class="fas fa-id-badge btn-icon"></i>
                </button>
                <button class="menu-btn" id="btnNavEventAttendance">
                    <span class="btn-text">Event Attendance</span> <i class="fas fa-chalkboard-teacher btn-icon"></i>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <div class="welcome-card" id="mainViewContainer">
                
                <div id="welcomeView" class="dashboard-view active" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;">
                    <h2 class="welcome-text">Welcome To ADHYORA</h2>
                </div>

                <div id="attendanceView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="timetableView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="internalMarksView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="subjectsView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="calendarView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="assignmentsView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="studentListView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="subjectAssignView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="batchView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                <div id="eventAttendanceView" class="dashboard-view hidden-view" style="padding: 25px;"></div>
                
                <div id="notificationsView" class="dashboard-view hidden-view" style="padding: 25px;"><h3 style="color:var(--brand-red);">System Inbox</h3></div>
                <div id="messagesView" class="dashboard-view hidden-view" style="padding: 25px;"><h3 style="color:var(--brand-red);">Messages</h3></div>

            </div>
        </main>
    </div>

    <div class="modal-overlay" id="settingsOverlay">
        <div class="settings-drawer">
            <button class="close-settings" id="closeSettingsBtn"><i class="fas fa-times"></i></button>
            <div class="settings-header">
                <div class="profile-avatar"><i class="fas fa-chalkboard-teacher"></i></div>
                <h3 id="teacherNameText">Loading...</h3>
                <p id="teacherEmailText">email@loading.com</p>
                <div class="role-badge" style="background: var(--brand-red); color:white; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:bold; display:inline-block;">Teacher</div>
            </div>
            <div class="settings-menu">
                <button class="settings-btn logout-btn" id="btnSignOut" style="background:#fff5f5; border:1px solid #fecaca; color:#ef4444; width:100%; padding:15px; border-radius:12px; font-weight:bold; cursor:pointer;"><i class="fas fa-sign-out-alt"></i> Sign Out</button>
            </div>
        </div>
    </div>

    <script type="module" src="teacherApp.js"></script>
</body>
</html>
